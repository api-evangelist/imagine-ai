aid: imagine-ai
name: Imagine Ai
description: >-
  Imagine AI (YC F25) is a San Francisco B2B content platform, founded in 2025
  by Neo Lee and Sky Yang, that reverse-engineers modern B2B growth starting
  with LinkedIn. It builds a persona-driven AI clone of a founder or executive
  by deeply analyzing their writing, speaking style, and market context, then
  uses that persona to plan content strategy, write LinkedIn posts, draft
  comments and DMs, and schedule coordinated distribution across an executive
  team (CEO, VP of Sales, Head of Marketing) from a single shared content
  calendar. Each client is paired with a dedicated content engineer, and the
  platform tracks engagement-quality analytics and inbound lead generation;
  early customers include MongoDB, Rippling, and Conduit. Imagine AI is a
  sales-led SaaS with no public self-serve developer API, SDK, or OpenAPI
  definition as of this catalog entry — this profile captures the company's
  identity and public web properties for the API Evangelist network.
